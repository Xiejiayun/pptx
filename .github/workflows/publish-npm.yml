name: Publish npm package

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-npm-0.1.0
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Update npm for trusted publishing
        run: npm install --global npm@latest
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run strict checks
        run: pnpm check
      - name: Build package
        run: pnpm --filter @jiayunxie/pptx build
      - name: Pack exact release artifact
        run: |
          mkdir -p artifacts/npm
          pnpm --filter @jiayunxie/pptx pack --pack-destination artifacts/npm
      - name: Verify packed package
        run: node scripts/smoke-npm-package.mjs artifacts/npm/jiayunxie-pptx-0.1.0.tgz
      - name: Ensure version is unpublished
        run: |
          if npm view @jiayunxie/pptx@0.1.0 version >/dev/null 2>&1; then
            echo '@jiayunxie/pptx@0.1.0 is already published' >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: jiayunxie-pptx-0.1.0
          path: artifacts/npm/jiayunxie-pptx-0.1.0.tgz
          if-no-files-found: error
      - name: Publish with provenance
        run: npm publish artifacts/npm/jiayunxie-pptx-0.1.0.tgz --access public --tag next --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
