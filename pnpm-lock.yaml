lockfileVersion: '9.0'

settings:
  autoInstallPeers: true
  excludeLinksFromLockfile: false

importers:

  .:
    devDependencies:
      '@types/node':
        specifier: ^24.0.0
        version: 24.13.3
      typescript:
        specifier: ^5.8.3
        version: 5.9.3
      vitest:
        specifier: ^3.2.4
        version: 3.2.7(@types/node@24.13.3)

  packages/codecs:
    dependencies:
      '@pptx/lossless-xml':
        specifier: workspace:*
        version: link:../lossless-xml
      '@pptx/opc':
        specifier: workspace:*
        version: link:../opc
    devDependencies:
      jszip:
        specifier: ^3.10.1
        version: 3.10.1

  packages/lossless-xml: {}

  packages/model:
    dependencies:
      '@pptx/codecs':
        specifier: workspace:*
        version: link:../codecs
      '@pptx/lossless-xml':
        specifier: workspace:*
        version: link:../lossless-xml
      '@pptx/opc':
        specifier: workspace:*
        version: link:../opc
    devDependencies:
      jszip:
        specifier: ^3.10.1
        version: 3.10.1

  packages/opc:
    dependencies:
      '@pptx/lossless-xml':
        specifier: workspace:*
        version: link:../lossless-xml
      jszip:
        specifier: ^3.10.1
        version: 3.10.1

  packages/pptxgenjs-adapter:
    dependencies:
      '@pptx/sdk':
        specifier: workspace:*
        version: link:../sdk
      pptxgenjs:
        specifier: ^4.0.1
        version: 4.0.1

  packages/sdk:
    dependencies:
      '@pptx/codecs':
        specifier: workspace:*
        version: link:../codecs
      '@pptx/lossless-xml':
        specifier: workspace:*
        version: link:../lossless-xml
      '@pptx/model':
        specifier: workspace:*
        version: link:../model
      '@pptx/opc':
        specifier: workspace:*
        version: link:../opc
      '@pptx/validator':
        specifier: workspace:*
        version: link:../validator
    devDependencies:
      jszip:
        specifier: ^3.10.1
        version: 3.10.1

  packages/validator:
    dependencies:
      '@pptx/opc':
        specifier: workspace:*
        version: link:../opc
    devDependencies:
      jszip:
        specifier: ^3.10.1
        version: 3.10.1

